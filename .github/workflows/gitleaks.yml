name: Gitleaks secret scan

# Second layer against accidentally committed secrets, on top of GitHub's
# native secret scanning + push protection. gitleaks' broader regex/entropy
# rules catch provider keys outside GitHub's partner program. Uses the plain
# MIT-licensed binary (pinned + checksum-verified) rather than the action
# wrapper.

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: gitleaks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: gitleaks-scan # status-check name used by branch protection
    permissions:
      contents: read
      security-events: write # to upload results to the Security tab
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Pinned version + checksum: no unauthenticated "latest" API lookup
      # (which gets rate-limited and broke installs), and the binary is
      # verified before it runs. Bump both values together.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks

      - name: Scan for secrets
        run: |
          ./gitleaks detect \
            --source . \
            --redact \
            --verbose \
            --report-format sarif \
            --report-path gitleaks-report.sarif

      - name: Upload results to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: gitleaks-report.sarif
